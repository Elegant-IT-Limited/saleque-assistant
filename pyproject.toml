[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "saleque-assistant"
version = "0.8.0"
requires-python = ">=3.10"
license = "MIT"
description = "Multi-tenant RAG assistant for the SaleQue CRM: cited answers on PostgreSQL and pgvector with Row Level Security, Claude and OpenAI behind one adapter, Jev lead scoring. Reference build."
dependencies = [
  "fastapi>=0.141",
  "psycopg[binary]>=3.3",
  "pydantic>=2.13",
  "anthropic>=1.8",
  "openai>=3.19",
  "typesafe-sdk>=0.7.1",
]

[project.urls]
Repository = "https://github.com/Elegant-IT-Limited/saleque-assistant"
"Case study" = "https://eleganttechbd.com/works/saleque-ai-crm-rag-assistant"

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx>=0.28", "ruff>=0.16"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
