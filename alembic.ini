[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# one folder per module under alembic/versions/, so a reviewer sees at a glance
# which module a schema change belongs to
version_locations = %(here)s/alembic/versions
recursive_version_locations = true
path_separator = os
# sqlalchemy.url is read from DATABASE_URL in env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
